<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N4 Kanji — Flashcard</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface2:#eceef2;
  --text:#1a1d23; --muted:#6b7280;
  --accent:#4f46e5; --accent-soft:#eef0ff;
  --green:#16a34a; --green-soft:#e9f7ef;
  --orange:#ea7c28;
  --radius:16px;
  --shadow:0 1px 3px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Hiragino Sans","Noto Sans JP",sans-serif}
.phone{width:100%;max-width:480px;min-height:100vh;padding:0 16px 40px}
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 0;background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;flex:1}
.logo{display:inline-flex;width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.pill{background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;box-shadow:var(--shadow);color:var(--muted)}
.pill b{color:var(--green)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);padding:5px;border-radius:12px;margin-top:8px}
.seg button{border:0;background:transparent;padding:9px 8px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.small{font-size:13px}.muted{color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;width:0%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.btn{border:0;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .05s ease}
.btn:active{transform:scale(.98)}
.btn-green{background:var(--green);color:#fff}
.btn-orange{background:var(--orange);color:#fff}
.btn-primary{background:var(--accent);color:#fff}
.btn-block{width:100%}
.toggle-btn{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit}
.toggle-btn.on{color:var(--accent)}
/* flashcard */
.flash-wrap{perspective:1200px;margin-top:16px}
.flashcard{position:relative;width:100%;height:340px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.3,1);cursor:pointer}
.flashcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:auto}
.face.back{transform:rotateY(180deg);justify-content:flex-start;padding-top:36px}
.kanji-big{font-size:88px;font-weight:700;line-height:1.15}
.hint{margin-top:18px;font-size:12px;color:var(--muted)}
.reading{font-size:30px;font-weight:800;color:var(--accent)}
.meaning{font-size:19px;font-weight:700;margin-top:6px}
.lvl{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-top:12px}
.example{margin-top:16px;font-size:15px;line-height:1.7;background:var(--surface2);padding:12px 14px;border-radius:12px;width:100%}
.example-id{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.6}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
/* done */
.done{text-align:center;padding:28px 16px}
.done .big{font-size:44px}
.section{font-size:18px;font-weight:800}
/* list */
.search{width:100%;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:12px;padding:13px 16px;font-size:15px;font-family:inherit;outline:none}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer}
.item .top{display:flex;align-items:center;gap:12px}
.item .k{font-size:26px;font-weight:700;min-width:52px;text-align:center}
.item .info{flex:1;min-width:0}
.item .info b{display:block;font-size:14px}
.item .info span{font-size:13px;color:var(--muted)}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.green{background:var(--green-soft);color:var(--green)}
.item .ex{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--surface2);font-size:14px;line-height:1.7}
.item.open .ex{display:block}
.item .ex .id{color:var(--muted);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:32px 0;font-size:14px}
.footer-note{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
</style>
</head>
<body>
<div class="phone">
  <header class="appbar">
    <div class="brand"><span class="logo">日</span> N4 Kanji</div>
    <span class="pill">✓ <b id="mCount">0</b>/<span id="mTotal">0</span> hafal</span>
  </header>

  <div class="seg" role="tablist" aria-label="Tampilan">
    <button id="tabCard" class="active" role="tab">🃏 Kartu</button>
    <button id="tabList" role="tab">📋 Daftar</button>
  </div>

  <!-- ====== KARTU ====== -->
  <section id="panelCard">
    <div class="row between mt16">
      <span class="small muted" id="cardCounter">Kartu 1</span>
      <button class="toggle-btn" id="btnShuffle">🔀 Acak: mati</button>
    </div>
    <div class="bar mt8"><i id="cardBar"></i></div>

    <div class="flash-wrap" id="flashWrap">
      <div class="flashcard" id="flashcard" role="button" tabindex="0" aria-label="Kartu kanji, ketuk untuk membalik">
        <div class="face front">
          <div class="kanji-big" id="cardKanji">漢字</div>
          <div class="hint">Ketuk kartu untuk membalik</div>
        </div>
        <div class="face back">
          <div class="reading" id="cardReading"></div>
          <div class="meaning" id="cardMeaning"></div>
          <span class="lvl">JLPT N4</span>
          <div class="example" id="cardExample"></div>
          <div class="example-id" id="cardExampleId"></div>
        </div>
      </div>
    </div>

    <div class="fc-actions" id="fcActions">
      <button class="btn btn-orange" id="btnUlangi">↺ Ulangi</button>
      <button class="btn btn-green" id="btnHafal">✓ Hafal</button>
    </div>

    <div class="card done mt16" id="fcDone" hidden>
      <div class="big">🎉</div>
      <h2 class="section mt8">Sesi selesai!</h2>
      <p class="muted small mt8" id="doneSummary"></p>
      <button class="btn btn-orange btn-block mt16" id="btnHardOnly" hidden>↺ Ulangi kartu sulit (<span id="hardCount">0</span>)</button>
      <button class="btn btn-primary btn-block mt12" id="btnRestart">Mulai sesi baru</button>
    </div>
  </section>

  <!-- ====== DAFTAR ====== -->
  <section id="panelList" hidden>
    <p class="small muted mt16">Ketuk baris untuk melihat contoh kalimat. Tanda ✓ hafal tersimpan otomatis di perangkatmu.</p>
    <input type="search" class="search mt12" id="kanjiSearch" placeholder="Cari kanji / reading / arti…" aria-label="Cari kanji">
    <div class="list mt12" id="kanjiList"></div>
  </section>

  <div class="footer-note">140 kata kanji JLPT N4 · progres tersimpan di perangkat ini</div>
</div>

/* ================= LOGIC ================= */
const $ = id => document.getElementById(id);
const LS_KEY = 'n4kanji_mastered_v1';

let mastered = new Set(JSON.parse(localStorage.getItem(LS_KEY) || '[]'));
const saveMastered = () => localStorage.setItem(LS_KEY, JSON.stringify([...mastered]));

let shuffleOn = false;
let order = [];
let pos = 0;
let flipped = false;
let sessionHard = new Set();   // index dalam KANJI
let sessionNewMaster = 0;

function shuffled(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildOrder(indices){
  order = shuffleOn ? shuffled(indices) : indices.slice();
  pos = 0;
  flipped = false;
  sessionNewMaster = 0;
  $('fcDone').hidden = true;
  $('flashWrap').style.display = '';
  $('fcActions').style.display = '';
  renderCard();
}

function renderCard(){
  const total = order.length;
  if(pos >= total){ endSession(); return; }
  const item = KANJI[order[pos]];
  flipped = false;
  $('flashcard').classList.remove('flip');
  $('cardKanji').textContent = item.k;
  $('cardReading').textContent = item.r;
  $('cardMeaning').textContent = item.m;
  $('cardExample').textContent = item.ex;
  $('cardExampleId').textContent = item.exi;
  $('cardCounter').textContent = 'Kartu ' + (pos + 1) + ' dari ' + total;
  $('cardBar').style.width = (pos / total * 100) + '%';
}

function endSession(){
  $('flashWrap').style.display = 'none';
  $('fcActions').style.display = 'none';
  $('fcDone').hidden = false;
  $('cardBar').style.width = '100%';
  $('doneSummary').textContent = order.length + ' kartu diulas · ' + sessionNewMaster + ' hafal baru · ' + sessionHard.size + ' ditandai sulit';
  $('btnHardOnly').hidden = sessionHard.size === 0;
  $('hardCount').textContent = sessionHard.size;
}

function flip(){ 
  flipped = !flipped;
  $('flashcard').classList.toggle('flip', flipped);
}

function updatePill(){
  $('mCount').textContent = mastered.size;
  $('mTotal').textContent = KANJI.length;
}

/* --- events kartu --- */
$('flashcard').addEventListener('click', flip);
$('flashcard').addEventListener('keydown', e => {
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); flip(); }
});

$('btnHafal').addEventListener('click', () => {
  const item = KANJI[order[pos]];
  if(!mastered.has(item.id)){
    mastered.add(item.id);
    sessionNewMaster++;
    saveMastered();
    updatePill();
  }
  pos++; renderCard();
});

$('btnUlangi').addEventListener('click', () => {
  sessionHard.add(order[pos]);
  pos++; renderCard();
});

$('btnShuffle').addEventListener('click', () => {
  shuffleOn = !shuffleOn;
  $('btnShuffle').textContent = '🔀 Acak: ' + (shuffleOn ? 'nyala' : 'mati');
  $('btnShuffle').classList.toggle('on', shuffleOn);
  sessionHard = new Set();
  buildOrder(KANJI.map((_, i) => i));
});

$('btnRestart').addEventListener('click', () => {
  sessionHard = new Set();
  buildOrder(KANJI.map((_, i) => i));
});

$('btnHardOnly').addEventListener('click', () => {
  const hardIdx = [...sessionHard];
  sessionHard = new Set();
  buildOrder(hardIdx);
});

/* --- events daftar --- */
function renderList(q){
  q = (q || '').trim().toLowerCase();
  const items = KANJI.filter(it => !q ||
    it.k.includes(q) || it.r.includes(q) ||
    it.m.toLowerCase().includes(q) || it.exi.toLowerCase().includes(q));
  $('kanjiList').innerHTML = items.length ? items.map(it =>
    '<div class="item" data-id="' + it.id + '">' +
      '<div class="top">' +
        '<div class="k">' + it.k + '</div>' +
        '<div class="info"><b>' + it.r + '</b><span>' + it.m + '</span></div>' +
        (mastered.has(it.id) ? '<span class="tag green">✓ hafal</span>' : '<span class="tag">N4</span>') +
      '</div>' +
      '<div class="ex">' + it.ex + '<div class="id">' + it.exi + '</div></div>' +
    '</div>'
  ).join('') : '<div class="empty">Tidak ada hasil untuk "' + q + '".</div>';
}

$('kanjiSearch').addEventListener('input', e => renderList(e.target.value));
$('kanjiList').addEventListener('click', e => {
  const item = e.target.closest('.item');
  if(item) item.classList.toggle('open');
});

/* --- tab --- */
$('tabCard').addEventListener('click', () => {
  $('tabCard').classList.add('active'); $('tabList').classList.remove('active');
  $('panelCard').hidden = false; $('panelList').hidden = true;
});
$('tabList').addEventListener('click', () => {
  $('tabList').classList.add('active'); $('tabCard').classList.remove('active');
  $('panelList').hidden = false; $('panelCard').hidden = true;
  renderList($('kanjiSearch').value);
});

/* --- init --- */
updatePill();
renderList('');
buildOrder(KANJI.map((_, i) => i));
</script>
